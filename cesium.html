<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Wind Farms – 3D Globe</title>

<!-- Cesium -->
<script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

<style>
html, body, #cesiumContainer {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

#view-switcher {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 10000;
}

#view-switcher button {
  font-size: 16px;
  padding: 8px 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  background: #2c3e50;
  color: white;
}
</style>
</head>

<body>

<div id="view-switcher">
  <button onclick="location.href='index.html'">
    🗺️ 2D Map
  </button>
</div>

<div id="cesiumContainer"></div>

<script>

    console.log("Ion token:", Cesium.Ion.defaultAccessToken);
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
    console.log("Cesium script loaded");
    console.log("Creating Cesium viewer");

    const viewer = new Cesium.Viewer("cesiumContainer", {
    terrainProvider: Cesium.Terrain.fromWorldTerrain(),
    animation: false,
    timeline: false,
    baseLayerPicker: true
    });

    viewer.scene.globe.depthTestAgainstTerrain = true;

    console.log("Cesium viewer created", viewer);

    Papa.parse("./data/wind_farms.csv", {
      download: true,
      header: true,
      skipEmptyLines: true,
      worker: true,  // run parsing in a separate thread
      step: function(row) {
          if (!row.data["geometry.coordinates"]) return;

          const coords = row.data["geometry.coordinates"].replace(/[\[\]"]/g, "").split(",");
          const lon = parseFloat(coords[0]);
          const lat = parseFloat(coords[1]);
          if (isNaN(lat) || isNaN(lon)) return;

          viewer.entities.add({
              position: Cesium.Cartesian3.fromDegrees(lon, lat),
              point: { pixelSize: 6, color: Cesium.Color.CYAN },
              description: `
                  <b>Name:</b> ${row.data["properties.name"]}<br>
                  <b>Operator:</b> ${row.data["Operator"]}<br>
                  <b>Start Date:</b> ${row.data["Start Date"]}<br>
                  <b>Diameter:</b> ${row.data["Diameter"]}<br>
                  <b>Hub Height:</b> ${row.data["Hub Height"]}<br>
                  <b>Total Height:</b> ${row.data["Total Height"]}<br>
                  <b>Manufacturer:</b> ${row.data["Manufacturer"]}<br>
                  <b>Model:</b> ${row.data["Model"]}<br>
                  <b>Rated Power:</b> ${row.data["Rated Power"]}
              `
          });
      },
      complete: function() {
          console.log("CSV loading complete");
      }
  });


    // const hubHeight = parseFloat(row["Hub Height"]) || 50; // fallback if missing
    // const scale = hubHeight / 50; // adjust 50 as “base model height”

    //     uri: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Windmill/glTF/Windmill.gltf',
    //     scale: scale,
    //     minimumPixelSize: 64,      // ensures visibility when zoomed out
    //     maximumScale: 200
    // },
  </script>
    
</body>
</html>
