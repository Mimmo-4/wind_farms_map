<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Wind Farms – 3D Globe</title>

<!-- Cesium -->
<script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

<style>
html, body, #cesiumContainer {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

#view-switcher {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 10000;
}

#view-switcher button {
  font-size: 16px;
  padding: 8px 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  background: #2c3e50;
  color: white;
}
</style>
</head>

<body>

<div id="view-switcher">
  <button onclick="location.href='index.html'">
    🗺️ 2D Map
  </button>
</div>

<div id="cesiumContainer"></div>

<script>
    Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlMTZhOTYzMC0wNGNlLTQ5NzctYWRhYS03YWFkYzZmNTVmNGQiLCJpZCI6MzcxMjU2LCJpYXQiOjE3NjYxNTc0Nzd9.4RV9x9K8HkAhF8iQKw5ICLzwWOgRMsMH4Aye7WK4Ixw";
    console.log("Ion token:", Cesium.Ion.defaultAccessToken);
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
    console.log("Cesium script loaded");
    console.log("Creating Cesium viewer");

    const viewer = new Cesium.Viewer("cesiumContainer", {
    terrainProvider: Cesium.Terrain.fromWorldTerrain(),
    animation: false,
    timeline: false,
    baseLayerPicker: true
    });

    // const viewer = new Cesium.Viewer("cesiumContainer", {
    // imageryProvider: new Cesium.OpenStreetMapImageryProvider({
    //     url: 'https://a.tile.openstreetmap.org/'
    // }),
    // baseLayerPicker: false,
    // terrainProvider: new Cesium.EllipsoidTerrainProvider(), // flat Earth
    // animation: false,
    // timeline: false
    // });


    viewer.scene.globe.depthTestAgainstTerrain = true;

    console.log("Cesium viewer created", viewer);

    Papa.parse("./data/wind_farms.csv", {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            results.data.forEach(row => {
                if (!row["geometry.coordinates"]) return;

                const coords = row["geometry.coordinates"].replace(/[\[\]"]/g, "").split(",");
                const lon = parseFloat(coords[0]);
                const lat = parseFloat(coords[1]);
                if (isNaN(lat) || isNaN(lon)) return;

                console.log("Adding point:", lat, lon);

                const hubHeight = parseFloat(row["Hub Height"]) || 50; // fallback if missing
                const scale = hubHeight / 50; // adjust 50 as “base model height”


                viewer.entities.add({
                    position: Cesium.Cartesian3.fromDegrees(lon, lat),
                    point: { pixelSize: 6, color: Cesium.Color.CYAN },
                    // model: {
                    //     uri: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Windmill/glTF/Windmill.gltf',
                    //     scale: scale,
                    //     minimumPixelSize: 64,      // ensures visibility when zoomed out
                    //     maximumScale: 200
                    // },
                    description: `
                        <b>Name:</b> ${row["properties.name"]}<br>
                        <b>Operator:</b> ${row["Operator"]}<br>
                        <b>Start Date:</b> ${row["Start Date"]}<br>
                        <b>Diameter:</b> ${row["Diameter"]}<br>
                        <b>Hub Height:</b> ${row["Hub Height"]}<br>
                        <b>Total Height:</b> ${row["Total Height"]}<br>
                        <b>Manufacturer:</b> ${row["Manufacturer"]}<br>
                        <b>Model:</b> ${row["Model"]}<br>
                        <b>Rated Power:</b> ${row["Rated Power"]}
                    `
                });
            });

            // Center camera
            const positions = viewer.entities.values.map(e => e.position.getValue(Cesium.JulianDate.now()));
            if (positions.length > 0) {
                const rectangle = Cesium.Rectangle.fromCartesianArray(positions);
                viewer.camera.flyTo({ destination: rectangle });
            }
        }
    });

    </script>
    
</body>
</html>
