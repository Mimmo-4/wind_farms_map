<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Wind Farms – 3D Globe</title>

<!-- Cesium -->
<script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

<style>
html, body, #cesiumContainer {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  z-index: 1;
}

#view-switcher {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 10001;
}

#view-switcher button {
  font-size: 16px;
  padding: 8px 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  background: #2c3e50;
  color: white;
}
</style>
</head>

<body>

<div id="view-switcher">
  <button onclick="location.href='index.html'">
    🗺️ 2D Map
  </button>
</div>

<div id="cesiumContainer"></div>

<script>
    Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlMTZhOTYzMC0wNGNlLTQ5NzctYWRhYS03YWFkYzZmNTVmNGQiLCJpZCI6MzcxMjU2LCJpYXQiOjE3NjYxNTc0Nzd9.4RV9x9K8HkAhF8iQKw5ICLzwWOgRMsMH4Aye7WK4Ixw";
    console.log("Ion token:", Cesium.Ion.defaultAccessToken);
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
    console.log("Cesium script loaded");
    console.log("Creating Cesium viewer");

    const viewer = new Cesium.Viewer("cesiumContainer", {
    terrainProvider: Cesium.Terrain.fromWorldTerrain(),
    animation: false,
    timeline: false,
    baseLayerPicker: true
    });

    viewer.scene.globe.depthTestAgainstTerrain = true;

    console.log("Cesium viewer created", viewer);

    fetch("./data/wind_farms.csv")
    .then(r => r.text())
    .then(text => {
        const lines = text.trim().split("\n");
        const header = lines[0].split(",");

        const coordIdx = header.indexOf("geometry.coordinates");
        const hubIdx = header.indexOf("Hub Height");  // <-- index for hub height
        if (coordIdx === -1) {
            console.error("geometry.coordinates column not found");
            return;
        }

        lines.slice(1).forEach(line => {
            const cols = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
            if (!cols || cols.length <= coordIdx) return;

            let coordStr = cols[coordIdx];
            if (!coordStr) return;

            coordStr = coordStr.replace(/["\[\]]/g, "");
            const coords = coordStr.split(",");
            if (coords.length !== 2) return;

            const lon = parseFloat(coords[0]);
            const lat = parseFloat(coords[1]);
            if (isNaN(lat) || isNaN(lon)) return;

            // const hubHeight = parseFloat(cols[hubIdx]) || 50; // <-- use cols, not row
            // const scale = hubHeight / 50;

            viewer.entities.add({
                position: Cesium.Cartesian3.fromDegrees(lon, lat),
                point: { pixelSize: 6, color: Cesium.Color.CYAN },
                // model: {
                //     uri: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Windmill/glTF/Windmill.gltf',
                //     scale: scale,
                //     minimumPixelSize: 64,
                //     maximumScale: 200
                // },
                description: `
                    <b>Name:</b> ${cols[header.indexOf("properties.name")]}<br>
                    <b>Operator:</b> ${cols[header.indexOf("Operator")]}<br>
                    <b>Start Date:</b> ${cols[header.indexOf("Start Date")]}<br>
                    <b>Diameter:</b> ${cols[header.indexOf("Diameter")]}<br>
                    <b>Hub Height:</b> ${cols[hubIdx]}<br>
                    <b>Total Height:</b> ${cols[header.indexOf("Total Height")]}<br>
                    <b>Manufacturer:</b> ${cols[header.indexOf("Manufacturer")]}<br>
                    <b>Model:</b> ${cols[header.indexOf("Model")]}<br>
                    <b>Rated Power:</b> ${cols[header.indexOf("Rated Power")]}
                `
            });

        });

        // Center camera after all entities are added
        const positions = viewer.entities.values.map(e => e.position.getValue(Cesium.JulianDate.now()));
        if (positions.length > 0) {
            const rectangle = Cesium.Rectangle.fromCartesianArray(positions);
            viewer.camera.flyTo({ destination: rectangle });
        }
    });


    // model: {
    //     uri: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Windmill/glTF/Windmill.gltf',
    //     scale: scale,
    //     minimumPixelSize: 64,      // ensures visibility when zoomed out
    //     maximumScale: 200
    // },
  </script>
    
</body>
</html>
